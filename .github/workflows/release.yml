name: Release

# Push to main with pending changesets opens or updates the "Version Packages" PR;
# merging it publishes to npm with trusted publishing (OIDC, no npm token), tags the
# release and creates the GitHub Release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
